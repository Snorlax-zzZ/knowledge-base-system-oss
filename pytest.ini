[pytest]
# 只 collect tests/ 目录；防止 pytest 进 bin/kb-api/_internal/ 里
# qdrant_client / app 副本（installer 打包产物），导致 import 拿到旧版 app.services.*
# 模块覆盖源码版（v1.3.12 实测：bin 里旧 embedding_install 没 pytorch_mirror
# 参数，全套跑撞 TypeError；而 tests/ 隔离后正常）。
testpaths = tests
# 同款防御：即便 testpaths 被 CLI 覆盖（如 pytest .），也跳过 bin / dist / build
norecursedirs = bin dist build .venv node_modules __pycache__
